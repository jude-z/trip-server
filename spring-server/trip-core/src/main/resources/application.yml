server:
  port: 8080
  url: ${SERVER_URL}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/oauth2/callback/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname
            client-name: kakao
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/oauth2/callback/naver"
            authorization-grant-type: authorization_code
            scope: name,email
            client-name: naver
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/oauth2/callback/google"
            scope: profile,email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  secretKey: ${JWT_SECRET_KEY}
  access:
    expiration: ${JWT_ACCESS_EXPIRATION:30}
  refresh:
    expiration: ${JWT_REFRESH_EXPIRATION:10080}

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}

s3:
  credentials:
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    region: ${S3_REGION:ap-northeast-2}
  bucket: ${S3_BUCKET}

tourapi:
  service-key: ${TOURAPI_SERVICE_KEY}
  base-url: ${TOURAPI_BASE_URL:https://apis.data.go.kr/B551011/KorService1}

kindapi:
  service-key: ${KINDAPI_SERVICE_KEY}
  base-url: ${KINDAPI_BASE_URL}

fastAPI:
  url: ${FASTAPI_URL}

oauth2SuccessRedirectUrl: ${OAUTH2_SUCCESS_REDIRECT_URL:https://tripplai.vercel.app}

logging:
  level:
    org.hibernate.SQL: debug
